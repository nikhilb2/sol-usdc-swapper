# TEMPLATE ONLY — do not put real values here, this file is committed.
#
# Create the real secret with:  ./k8s/make-secret.sh
# which reads .env (gitignored) and applies it directly, so no secret ever
# touches the repo or your shell history.
#
# The wallet private key lives in here. Anyone who can read this secret can
# spend the wallet, so keep RBAC on the namespace tight.
apiVersion: v1
kind: Secret
metadata:
  name: sol-swapper-secrets
  namespace: nikhil
type: Opaque
stringData:
  # Solana wallet — base58 or JSON array
  PRIVATE_KEY: "REPLACE_ME"
  # Helius or other RPC endpoint
  RPC_URL: "https://mainnet.helius-rpc.com/?api-key=REPLACE_ME"
  # Shared Postgres. Percent-encode the password: a literal # truncates the URL.
  DATABASE_URL: "postgresql://solswapper:REPLACE_ME@postgres.db.svc.cluster.local:5432/sol-swapper"
  # Dashboard Basic auth — at least 12 characters or the server refuses to boot
  DASHBOARD_USER: "admin"
  DASHBOARD_PASSWORD: "REPLACE_ME"
  # Optional
  JUPITER_API_KEY: ""
  COINGECKO_API_KEY: ""
