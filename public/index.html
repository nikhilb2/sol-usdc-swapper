<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOL Accumulation</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#fff; --line:#e4e4e7; --ink:#18181b; --dim:#71717a;
    --pos:#15803d; --neg:#b91c1c; --warn:#b45309; --accent:#4f46e5; --chart:#6366f1;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0b0e; --panel:#141418; --line:#27272a; --ink:#f4f4f5; --dim:#a1a1aa;
      --pos:#4ade80; --neg:#f87171; --warn:#fbbf24; --accent:#818cf8; --chart:#818cf8;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-bottom:20px}
  h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
  .meta{color:var(--dim);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
  .tag{
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;
    font-size:11px;font-variant-numeric:tabular-nums;
  }
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--dim);margin:0 0 10px;font-weight:600;
  }
  .big{font-size:25px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .sub{color:var(--dim);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
  .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
  .row span:first-child{color:var(--dim)}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  th:first-child,td:first-child{text-align:left}
  .scroll{overflow-x:auto}
  .rail{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:12.5px}
  .rail .n{width:170px;color:var(--dim);flex:none}
  .rail .d{color:var(--dim);font-size:11.5px}
  .banner{
    border:1px solid var(--warn);border-radius:8px;padding:10px 14px;
    margin-bottom:12px;color:var(--warn);font-size:13px;
  }
  .muted{color:var(--dim)}
  button{
    font:inherit;font-size:12.5px;cursor:pointer;border-radius:7px;
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:6px 12px;
  }
  button:hover:not(:disabled){border-color:var(--dim)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.danger{border-color:var(--warn);color:var(--warn)}
  .confirm{
    border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin-top:10px;
    font-size:12px;
  }
  .confirm code{word-break:break-all;font-size:11.5px;color:var(--ink)}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .note{font-size:12px;margin-top:10px;padding:8px 10px;border-radius:7px;border:1px solid var(--line)}
  .note.ok{border-color:var(--pos);color:var(--pos)}
  .note.bad{border-color:var(--warn);color:var(--warn)}
  svg{display:block;width:100%;height:150px}
  input,select{
    font:inherit;font-size:12.5px;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .al-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .al-form input[type=number]{width:120px}
  .al-form input[name=note]{flex:1 1 160px}
  .al-form label{display:flex;gap:5px;align-items:center;color:var(--dim);font-size:12.5px}
  .al-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
  .al-row:last-child{border-bottom:0}
  .al-row .what{font-weight:600;font-variant-numeric:tabular-nums;min-width:150px}
  .al-row .grow{flex:1;min-width:0;color:var(--dim)}
  .al-row button{padding:3px 9px;font-size:11.5px}
  .al-row.off{opacity:.55}
  @media (max-width:560px){
    .al-row .what{min-width:0;flex:1}
    .al-row .grow{order:3;flex-basis:100%}
  }
  footer{color:var(--dim);font-size:11.5px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SOL Accumulation</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="banners"></div>
  <div id="app"><p class="muted">Loading…</p></div>

  <div class="card" style="margin-top:12px">
    <h2>Price alerts &rarr; Telegram</h2>
    <form class="al-form" id="al-form" autocomplete="off">
      <select name="symbol" aria-label="Token"></select>
      <select name="op" aria-label="Condition">
        <option value="below">below</option>
        <option value="above">above</option>
      </select>
      <input name="target" type="number" step="any" min="0" placeholder="USD price" aria-label="Target price" required>
      <label><input name="repeat" type="checkbox"> repeat</label>
      <input name="note" type="text" maxlength="120" placeholder="note (optional)" aria-label="Note">
      <button type="submit">Add alert</button>
    </form>
    <div class="sub" id="al-hint"></div>
    <div id="al-note"></div>
    <div id="al-list" style="margin-top:8px"><p class="muted">Loading…</p></div>
  </div>
  <footer>No trade can be made from this page &mdash; buys and sells are made by <code>node run.js</code>.
  The only action that touches funds moves the accumulated asset to the one address pinned in config.
  Price alerts only send a Telegram message.</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const n = (v, d = 4) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const usd = (v) => v === null || v === undefined ? "—" : "$" + Number(v).toFixed(2);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const signed = (v, d = 4) => (v >= 0 ? "+" : "") + n(v, d);
const signedUsd = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v))
  ? "—" : (v >= 0 ? "+$" : "-$") + Math.abs(Number(v)).toFixed(d);
const cls = (v) => v > 0 ? "pos" : v < 0 ? "neg" : "";

function sparkline(rows) {
  if (!rows || rows.length < 2) return '<p class="muted">No price history yet.</p>';
  const W = 900, H = 150, P = 4;
  const vals = rows.map(r => Number(r.close));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const x = i => P + (i / (vals.length - 1)) * (W - 2 * P);
  const y = v => H - P - ((v - lo) / span) * (H - 2 * P);
  const line = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${line}L${x(vals.length - 1).toFixed(1)},${H}L${x(0).toFixed(1)},${H}Z`;
  const first = vals[0], last = vals[vals.length - 1];
  const chg = ((last / first) - 1) * 100;
  return `
    <div class="row" style="padding-bottom:8px">
      <span>${esc(rows[0].date)} → ${esc(rows[rows.length - 1].date)}</span>
      <span class="${cls(chg)}">${signed(chg, 1)}%</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="SOL daily closes">
      <path d="${area}" fill="var(--chart)" opacity=".12"/>
      <path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="row"><span>low ${usd(lo)}</span><span>high ${usd(hi)}</span></div>`;
}

function benchmarks(rep) {
  if (!rep.flat) return `<p class="muted">No completed buys yet — nothing to compare.</p>`;
  // deltaSol/deltaPct come from report.js, so this page and `node report.js`
  // can never print different numbers for the same comparison.
  const one = (label, b, note) => `
      <div style="margin-bottom:10px">
        <div class="row"><span>${label}</span><span class="${cls(b.deltaSol)}">${signed(b.deltaSol)} SOL (${signed(b.deltaPct, 2)}%)</span></div>
        <div class="sub">${usd(b.spent)} → ${n(b.sol)} SOL &nbsp;·&nbsp; ${note}</div>
      </div>`;
  return one("Same capital", rep.flat.sameCapital, "same dollars, spread evenly — the honest read")
       + one("Same schedule", rep.flat.sameSchedule, "fixed daily amount — missed days show up here");
}

// ── Custody ──────────────────────────────────────────────────────────────────
//
// The moved units are still the bot's position and still in every P&L figure
// above; this card is only about WHERE they sit. See report.js buildReport.

// While a confirmation is armed or a request is in flight, the 20s poll must
// not re-render — it would destroy the strip mid-interaction.
let interactive = false;
// Held outside render() so a success/error survives the next poll.
let moveNote = null;
let armed = null;      // { nonce, units, dest, countdown }
// The last payload, so the armed strip can re-render its countdown without
// re-fetching (and without the poll, which is paused while interactive).
const last = { s: null, trades: [], prices: [] };

function custodyCard(s, rep) {
  const moved = rep.movedUnits > 1e-9;
  const t = s.transfer || {};
  if (!moved && !t.enabled) return "";

  const rows = [];
  // Two different quantities, and conflating them is exactly the confusion
  // this whole feature exists to prevent: custodyUnits is what the LEDGER
  // says should be here, movable is what the CHAIN says is here. They agree
  // on a reconciled wallet; when they don't, show both — the button can only
  // ever move what actually exists on chain.
  const movable = Number(t.movableUnits ?? rep.custodyUnits);
  const diverged = Math.abs(movable - rep.custodyUnits) > 1e-6;
  const walletRow = diverged
    ? `<div class="row"><span>wallet actually holds</span><span class="warn">${n(movable, 6)} ${esc(s.asset)}</span></div>`
    : "";

  if (moved) {
    rows.push(`<div class="row"><span>attributed, still here</span><span>${n(rep.custodyUnits, 6)} ${esc(s.asset)}</span></div>`);
    rows.push(walletRow);
    rows.push(`<div class="row"><span>moved to safe wallet</span><span>${n(rep.movedUnits, 6)} ${esc(s.asset)}</span></div>`);
    rows.push(`<div class="sub">${usd(rep.movedValueUsd)} &mdash; still yours; P&amp;L tracks it</div>`);
    if (rep.destUnits !== null && rep.destUnits !== undefined) {
      rows.push(rep.destReconciled
        ? `<div class="row"><span>safe wallet holds</span><span class="pos">${n(rep.destUnits, 6)} &check;</span></div>`
        : `<div class="row"><span>safe wallet holds</span><span class="warn">${n(rep.destUnits, 6)} &mdash; short by ${n(rep.destShortfall, 6)}</span></div>`);
    }
    if (rep.lastTransferAt) {
      rows.push(`<div class="row"><span>last moved</span><span>${esc(String(rep.lastTransferAt).slice(0, 16).replace("T", " "))}</span></div>`);
    }
  } else {
    rows.push(`<div class="row"><span>attributed, still here</span><span>${n(rep.custodyUnits, 6)} ${esc(s.asset)}</span></div>`);
    rows.push(walletRow);
    rows.push(`<div class="sub">nothing moved to safe custody yet</div>`);
  }
  if (diverged) {
    rows.push(`<div class="sub warn">the wallet and the trade log disagree — see the banner above; the button moves what is really there</div>`);
  }
  if (rep.destination) {
    rows.push(`<div class="row"><span>destination</span><span>${esc(rep.destination)}</span></div>`);
  }

  let action = "";
  if (t.enabled) {
    const movable = Number(t.movableUnits || 0);
    if (armed) {
      const wait = armed.countdown > 0;
      action = `
        <div class="confirm">
          Move <strong>${n(armed.units, 6)} ${esc(s.asset)}</strong> &mdash; the entire wallet balance &mdash; to:
          <div style="margin:6px 0"><code>${esc(armed.dest)}</code></div>
          This is a custody change, not a sale: P&amp;L keeps tracking these units.
          <div class="actions">
            <button id="mv-go" class="danger" ${wait ? "disabled" : ""}>${wait ? `Confirm move (${armed.countdown})` : "Confirm move"}</button>
            <button id="mv-no">Cancel</button>
          </div>
        </div>`;
    } else if (movable > 0) {
      action = `<div class="actions"><button id="mv-start">Move ${n(movable, 6)} ${esc(s.asset)} to safe wallet</button></div>`;
    } else {
      action = `<div class="sub muted">nothing in the bot wallet to move</div>`;
    }
  }

  const note = moveNote ? `<div class="note ${moveNote.ok ? "ok" : "bad"}">${esc(moveNote.text)}</div>` : "";
  return `<div class="card"><h2>Custody</h2>${rows.join("")}${action}${note}</div>`;
}

// Wired after every render, because innerHTML replaces the nodes.
function bindCustody(s) {
  const start = $("#mv-start");
  if (start) start.onclick = () => beginMove(s);
  const go = $("#mv-go");
  if (go) go.onclick = () => confirmMove(s);
  const no = $("#mv-no");
  if (no) no.onclick = () => { armed = null; interactive = false; tick(); };
}

async function beginMove(s) {
  moveNote = null;
  try {
    const { nonce } = await get("/api/transfer/nonce");
    interactive = true;
    armed = {
      nonce,
      units: Number(s.transfer.movableUnits || 0),
      dest: s.transfer.fullDestination || s.report.destination,
      countdown: 3,
    };
    redrawArmed();
    // Deliberate delay: it defeats a click-through and forces the destination
    // to be read at least once.
    const iv = setInterval(() => {
      if (!armed) return clearInterval(iv);
      armed.countdown--;
      redrawArmed();
      if (armed.countdown <= 0) clearInterval(iv);
    }, 1000);
    // Do not leave a confirmation armed indefinitely.
    setTimeout(() => { if (armed && armed.nonce === nonce) { armed = null; interactive = false; tick(); } }, 60000);
  } catch (e) {
    moveNote = { ok: false, text: `Could not start: ${e.message}` };
    tick();
  }
}

function redrawArmed() { if (last.s) render(last.s, last.trades, last.prices); }

async function confirmMove(s) {
  if (!armed) return;
  const { nonce, units } = armed;
  const btn = $("#mv-go");
  if (btn) { btn.disabled = true; btn.textContent = "Moving…"; }

  try {
    const r = await fetch("/api/transfer", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-swapper-confirm": "1",
        accept: "application/json",
      },
      body: JSON.stringify({ nonce, action: "transfer_out", expectUnits: units }),
    });
    const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));

    // The nonce is single-use and may already be consumed, so every path
    // below restarts the flow from scratch rather than reusing it.
    armed = null;
    interactive = false;

    if (!r.ok || !j.ok) {
      moveNote = j.code === "BALANCE_MISMATCH"
        ? { ok: false, text: `Balance changed to ${j.liveUnits} — nothing moved. Start again.` }
        : { ok: false, text: j.error || `HTTP ${r.status}` };
    } else {
      moveNote = { ok: true, text: j.dryRun
        ? `Dry run: ${j.units} would move to ${j.dest}. Nothing was submitted.`
        : `Moved ${j.units} to ${j.dest}. ${j.sig ? "tx " + String(j.sig).slice(0, 12) + "…" : ""}` };
    }
  } catch (e) {
    armed = null;
    interactive = false;
    moveNote = { ok: false, text: `Request failed: ${e.message}` };
  }

  await tick();
  // The confirmed-commitment balance can lag a beat behind the transaction.
  setTimeout(tick, 3000);
  setTimeout(() => { moveNote = null; tick(); }, 30000);
}

function render(s, trades, priceRows) {
  $("#meta").innerHTML = [
    `<span class="tag">${esc(s.asset)}</span>`,
    `<span class="tag">${usd(s.prices.asset)}</span>`,
    `<span class="tag">ratio ${n(s.prices.ratio, 5)}</span>`,
    `<span class="tag">${esc(s.wallet)}</span>`,
    `<span class="tag" title="${esc(s.storage)}">${esc(s.storage.length > 42 ? s.storage.slice(0, 40) + "…" : s.storage)}</span>`,
  ].join("");

  const banners = [];
  if (s.dryRun) banners.push("DRY_RUN is on — runs quote and log but never submit.");
  if (s.pending) banners.push(`Unresolved intent from ${esc(s.pending.createdAt)} — the bot is halted until it is resolved.`);

  // Everything below is measured on the bot-attributed position, so external
  // units no longer corrupt it. What is left to flag is the part that neither
  // the trade log nor a declared opening balance accounts for. The threshold
  // lives in report.js (`reconciled`) so the CLI agrees with this page.
  const rep = s.report;
  if (!rep.reconciled) {
    const over = rep.unexplainedUnits > 0;
    banners.push(
      `Wallet holds ${n(Math.abs(rep.unexplainedUnits), 6)} ${esc(s.asset)} ` +
      `${over ? "more" : "less"} than the trade log and any declared opening balance explain. ` +
      `The figures below are unaffected — they cover the bot's own position only — but check for ` +
      `${over ? "a transfer in or a swap made outside the bot" : "a transfer out, or the wrong wallet in .env"}. ` +
      `A known pre-existing balance can be declared with STRATEGY_OPENING_UNITS.`);
  }
  $("#banners").innerHTML = banners.map(b => `<div class="banner">${b}</div>`).join("");

  const failing = s.rails.filter(r => !r.passed);

  $("#app").innerHTML = `
    <div class="grid">
      <div class="card">
        <h2>Position — bot</h2>
        <div class="big">${n(rep.botSolEquiv)} <span style="font-size:14px" class="muted">SOL-eq</span></div>
        <div class="sub">${n(rep.botUnits, 6)} ${esc(s.asset)} · ${usd(rep.currentValueUsd)}</div>
        <div class="sub">wallet ${n(rep.walletUnits, 6)}${
          rep.openingUnits > 0 ? ` · opening ${n(rep.openingUnits, 6)}` : ""}${
          Math.abs(rep.unexplainedUnits) > 1e-6
            ? ` · <span class="${rep.reconciled ? "muted" : "warn"}">unexplained ${signed(rep.unexplainedUnits, 6)}</span>`
            : ` · <span class="muted">reconciled</span>`}</div>
        <div class="sub">${n(s.balances.sol, 4)} SOL gas · ${usd(s.balances.usdc)} USDC</div>
      </div>

      <div class="card">
        <h2>Profit / loss</h2>
        <div class="big ${cls(rep.plUsd)}">${signedUsd(rep.plUsd)} <span style="font-size:14px" class="muted">${signed(rep.plPct, 2)}%</span></div>
        <div class="sub">${usd(rep.currentValueUsd)} now · ${usd(rep.netDeployedUsd)} deployed</div>
        ${rep.sellCount ? `<div class="sub">realized ${signedUsd(rep.realizedPlUsd)} · unrealized ${signedUsd(rep.unrealizedPlUsd)}</div>` : ""}
        ${rep.plSol !== null ? `<div class="sub ${cls(rep.plSol)}">${signed(rep.plSol)} SOL vs bare SOL at cost (${signed(rep.plSolPct, 2)}%)</div>` : ""}
        <div class="sub muted">position only — $${n(rep.carryUsd, 2)} banked cash excluded</div>
      </div>

      <div class="card">
        <h2>Deployed</h2>
        <div class="big">${usd(rep.netDeployedUsd)}</div>
        <div class="sub">${rep.buyCount} buys · avg ${usd(rep.avgCostUsd)}</div>
        ${rep.sellCount ? `<div class="sub">${usd(rep.usdIn)} in · ${usd(rep.usdOut)} out</div>` : ""}
        <div class="sub">$${n(s.budget.carryUsd, 2)} banked, unspent</div>
      </div>

      <div class="card">
        <h2>Next action</h2>
        <div class="big ${s.decision.type === "BUY" ? "pos" : ""}">${esc(s.decision.type)}${s.decision.usd ? " " + usd(s.decision.usd) : ""}</div>
        <div class="sub">${esc(s.decision.reason)}</div>
        <div class="sub">${esc(s.cadence)} · $${s.dailyUsd}/day</div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
      ${custodyCard(s, rep)}
      <div class="card">
        <h2>vs. buying bare SOL</h2>
        ${benchmarks(rep)}
      </div>
      <div class="card">
        <h2>Rails${failing.length ? ` — ${failing.length} blocking` : ""}</h2>
        ${s.rails.map(r => `
          <div class="rail">
            <span>${r.passed ? "✅" : "⛔"}</span>
            <span class="n">${esc(r.name)}</span>
            <span class="d">${esc(r.detail)}</span>
          </div>`).join("")}
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <h2>SOL daily close</h2>
      ${sparkline(priceRows)}
    </div>

    <div class="card">
      <h2>Trades${trades.length ? ` — ${trades.length}` : ""}</h2>
      ${trades.length ? `<div class="scroll"><table>
        <thead><tr>
          <th>When</th><th>Kind</th><th>Spent</th><th>Received</th><th>Price</th><th>Intent</th>
        </tr></thead>
        <tbody>${trades.map(t => `
          <tr${t.dryRun ? ' class="muted"' : ""}>
            <td>${esc(String(t.timestamp).slice(0, 16).replace("T", " "))}</td>
            <td>${t.type === "transfer_out" ? "moved" : t.type === "transfer_in" ? "received" : esc(t.type)}${t.dryRun ? " (dry)" : ""}</td>
            <td>${n(t.fromAmount, 4)} ${esc(t.fromSym)}</td>
            <td>${t.type === "transfer_out"
                  ? `<span class="muted">&rarr; ${esc(t.dest ? String(t.dest).slice(0, 4) + "…" + String(t.dest).slice(-4) : "?")}</span>`
                  : `${n(t.toAmount, 6)} ${esc(t.toSym)}`}</td>
            <td>${usd(t.price)}</td>
            <td>${esc(t.intent)}</td>
          </tr>`).join("")}</tbody>
      </table></div>` : `<p class="muted">No trades yet.</p>`}
    </div>`;

  last.s = s; last.trades = trades; last.prices = priceRows;
  bindCustody(s);
}

async function get(path) {
  const r = await fetch(path, { headers: { accept: "application/json" } });
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

async function tick() {
  // A poll that re-rendered mid-interaction would destroy the confirm strip
  // and the user's place in the flow.
  if (interactive) return;
  try {
    const [s, trades, priceRows] = await Promise.all([
      get("/api/status"), get("/api/trades?limit=50"), get("/api/prices?days=180"),
    ]);
    render(s, trades, priceRows);
  } catch (e) {
    $("#app").innerHTML = `<div class="banner">Could not load: ${esc(e.message)}</div>`;
  }
}

tick();
setInterval(tick, 20000);

// ── Price alerts ─────────────────────────────────────────────────────────────
//
// Kept apart from tick() on purpose: the custody flow pauses tick(), and an
// alerts outage must not blank the rest of the page. The form is static
// markup, so a poll re-renders only the list and never eats what you typed.

const alertsState = { symbols: [], prices: {}, alerts: [], watcher: null };
const money = (v) => v >= 1 ? Number(v).toFixed(2) : Number(v).toPrecision(4);
const ago = (iso) => {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`;
};

function alertStatus(a) {
  if (!a.active) return `fired ${esc(String(a.lastFiredAt ?? "").slice(0, 16).replace("T", " "))}`;
  if (!a.armed) return "fired &middot; re-arms when price moves back";
  return "armed";
}

function renderAlerts() {
  const { alerts, watcher } = alertsState;
  const active = alerts.filter(a => a.active);

  // A stale pulse with live alerts means nothing will fire. Say so plainly.
  let pulse = "";
  if (active.length) {
    const limit = 3 * (watcher?.intervalSeconds || 60) * 1000;
    if (!watcher?.checkedAt) {
      pulse = `<div class="note bad">The watcher has not checked these yet. If this persists, <code>npm run watch</code> is not running.</div>`;
    } else if (Date.now() - Date.parse(watcher.checkedAt) > limit) {
      pulse = `<div class="note bad">The watcher last checked ${ago(watcher.checkedAt)} &mdash; alerts will not fire until it is back.</div>`;
    } else {
      pulse = `<div class="sub">watcher checked ${ago(watcher.checkedAt)}</div>`;
    }
  }

  const rows = alerts.map(a => `
    <div class="al-row${a.active ? "" : " off"}">
      <span class="what">${esc(a.symbol)} ${esc(a.op)} $${money(a.target)}</span>
      <span class="tag">${a.repeat ? "repeat" : "once"}</span>
      <span class="grow">${alertStatus(a)}${a.lastPrice ? ` &middot; last $${money(a.lastPrice)}` : ""}${a.note ? ` &middot; ${esc(a.note)}` : ""}</span>
      <button data-del="${Number(a.id)}" aria-label="Delete alert">Delete</button>
    </div>`).join("");

  $("#al-list").innerHTML = pulse + (rows || `<p class="muted">No alerts yet.</p>`);
  hintAlert();
}

// "SOL now $106.24", plus a warning when the new alert would fire at once —
// alerts are levels, not crossings, so "SOL above $100" at $106 fires on the
// next check.
function hintAlert() {
  const f = $("#al-form");
  const sym = f.symbol.value, op = f.op.value, target = Number(f.target.value);
  const now = alertsState.prices[sym];
  if (!now) { $("#al-hint").textContent = ""; return; }
  let text = `${sym} now $${money(now)}`;
  if (target > 0 && (op === "above" ? now >= target : now <= target)) {
    text += ` — already ${op} that, so this fires on the next check`;
  }
  $("#al-hint").textContent = text;
}

function alertNote(ok, text) {
  $("#al-note").innerHTML = text ? `<div class="note ${ok ? "ok" : "bad"}">${esc(text)}</div>` : "";
}

async function postAlerts(body) {
  const r = await fetch("/api/alerts", {
    method: "POST",
    headers: { "content-type": "application/json", "x-swapper-confirm": "1", accept: "application/json" },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || !j.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

async function loadAlerts() {
  try {
    const j = await get("/api/alerts");
    const first = !alertsState.symbols.length;
    Object.assign(alertsState, j);
    if (first) {
      const sel = $("#al-form").symbol;
      sel.innerHTML = j.symbols.map(s => `<option>${esc(s)}</option>`).join("");
      // Default to the asset the bot accumulates, when the page knows it.
      if (last.s && j.symbols.includes(last.s.asset)) sel.value = last.s.asset;
    }
    renderAlerts();
  } catch (e) {
    $("#al-list").innerHTML = `<div class="note bad">Could not load alerts: ${esc(e.message)}</div>`;
  }
}

$("#al-form").addEventListener("input", hintAlert);
$("#al-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector("button");
  btn.disabled = true;
  try {
    const { alert } = await postAlerts({
      action: "create",
      symbol: f.symbol.value,
      op: f.op.value,
      target: Number(f.target.value),
      repeat: f.repeat.checked,
      note: f.note.value,
    });
    alertNote(true, `Added: ${alert.symbol} ${alert.op} $${money(alert.target)}`);
    f.target.value = ""; f.note.value = ""; f.repeat.checked = false;
  } catch (e) {
    alertNote(false, e.message);
  } finally {
    btn.disabled = false;
  }
  await loadAlerts();
  setTimeout(() => alertNote(true, ""), 8000);
});

$("#al-list").addEventListener("click", async (ev) => {
  const id = ev.target?.dataset?.del;
  if (!id) return;
  ev.target.disabled = true;
  try { await postAlerts({ action: "delete", id: Number(id) }); alertNote(true, ""); }
  catch (e) { alertNote(false, e.message); }
  await loadAlerts();
});

loadAlerts();
setInterval(loadAlerts, 20000);
</script>
</body>
</html>
